plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

def generatedResources = project(":common").file("src/generated/resources")
def commonResources = project(":common").file("src/main/resources")

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        data {
            data()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'treephysics',
                    '--output', generatedResources.absolutePath,
                    '--existing', commonResources.absolutePath
        }
        server {
            server()
            gameDirectory = project.file('runs/server')

        }
        if (providers.gradleProperty('physicsRegressionTests').isPresent()) {
            physicsRegression {
                type = 'gameTestServer'
                gameDirectory = project.file('runs/physics-regression')
            }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}") {
        exclude group: "maven.modrinth"
    }

    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-$minecraft_version:$sable_companion_version"
    compileOnly "dev.ryanhcode.sable:sable-sable_rapier-$minecraft_version:$sable_version"
    if (providers.gradleProperty('physicsRegressionTests').isPresent()) {
        implementation "maven.modrinth:sable:${providers.gradleProperty('physicsRegressionSable').getOrElse('1L6XJqnY')}"
    } else {
        implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
            exclude group: "foundry.veil"
        }
    }

    runtimeOnly("maven.modrinth:no-mans-land:1.5.5")
    runtimeOnly("maven.modrinth:biolith:1ZfKhpFg")
    runtimeOnly("maven.modrinth:mixed-litter:1.2.1")

    compileOnly("maven.modrinth:malum:$malum_version")
    compileOnly("maven.modrinth:lodestonelib:$lodestone_version")
    compileOnly("maven.modrinth:spawn-mod:$spawn_version")
    compileOnly("maven.modrinth:blueprint:$blueprint_version")
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    if (providers.gradleProperty('physicsRegressionTests').isPresent()) {
        runtimeOnly 'maven.modrinth:lets-do-vinery:ZywXpLC6'
        runtimeOnly 'maven.modrinth:architectury-api:13.0.8+neoforge'
    }

}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}

// Keep the regression fixtures out of distributable builds.
if (providers.gradleProperty('physicsRegressionTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
